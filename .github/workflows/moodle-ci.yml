#
# Automatically runs the Moodle Plugin CI on every push and pull request.
# This includes code quality checks like phpcs, php-cs-fixer, and Moodle's own code checkers.
#
# For tag builds, it also creates a release on GitHub and uploads the plugin to the Moodle Marketplace.
#
# Based on:
# - https://github.com/moodlehq/moodle-plugin-ci.
# - https://github.com/moodlehq/moodle-plugin-release
# - https://github.com/softprops/action-gh-release.
#
name: Moodle Plugin CI

on: [ push, pull_request, workflow_dispatch ]

jobs:
  test:
    runs-on: ubuntu-22.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: 'postgres'
          POSTGRES_HOST_AUTH_METHOD: 'trust'
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 3

      mariadb:
        image: mariadb:10
        env:
          MYSQL_USER: 'root'
          MYSQL_ALLOW_EMPTY_PASSWORD: "true"
          MYSQL_CHARACTER_SET_SERVER: "utf8mb4"
          MYSQL_COLLATION_SERVER: "utf8mb4_unicode_ci"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval 10s --health-timeout 5s --health-retries 3

    strategy:
      fail-fast: false
      matrix:
        php:  # see https://moodledev.io/general/development/policies/php
          - '8.1' # min. supported version by Moodle 4.5
          - '8.3' # max. supported version by Moodle 4.5
          - '8.4' # max. supported version by Moodle 5.0/5.1
        moodle-branch:
          # Versions officially supported by Moodle (https://moodledev.io/general/releases)
          - 'MOODLE_405_STABLE'
          - 'MOODLE_500_STABLE'
          - 'MOODLE_501_STABLE'
          - 'MOODLE_502_STABLE'
          - 'main'
        database: [ pgsql ]  # We don't use any database specific features, and our test sites run mariadb already.
        exclude:
          # Moodle 5.0+ requires PHP 8.2+
          - php: '8.1'
            moodle-branch: 'MOODLE_500_STABLE'
          - php: '8.1'
            moodle-branch: 'MOODLE_501_STABLE'
          - php: '8.1'
            moodle-branch: 'MOODLE_502_STABLE'
          - php: '8.1'
            moodle-branch: 'main'
          # Moodle 4.5 only supports PHP 8.1-8.3
          - php: '8.4'
            moodle-branch: 'MOODLE_405_STABLE'

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ${{ matrix.extensions }}
          ini-values: max_input_vars=5000
          # If you are not using code coverage, keep "none". Otherwise, use "pcov" (Moodle 3.10 and up) or "xdebug".
          # If you try to use code coverage with "none", it will fallback to phpdbg (which has known problems).
          coverage: none

      - name: Install plugin dependencies
        run: |
          cd plugin
          composer install --prefer-dist --no-interaction --no-progress --no-suggest --optimize-autoloader

      - name: Initialise moodle-plugin-ci
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4.5.4
          echo $(cd ci/bin; pwd) >> $GITHUB_PATH
          echo $(cd ci/vendor/bin; pwd) >> $GITHUB_PATH
          sudo locale-gen en_AU.UTF-8
          echo "NVM_DIR=$HOME/.nvm" >> $GITHUB_ENV

      - name: Install moodle-plugin-ci
        run: |
          moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1

        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle-branch }}
          IGNORE_PATHS: 'vendor,development'

      - name: PHP Lint
        if: ${{ always() }}
        run: moodle-plugin-ci phplint

      - name: PHP code sniffer & php-cs-fixer
        if: ${{ always() }}
        run: |
          cd plugin
          composer lint

      - name: PHP Mess Detector
        continue-on-error: true # This step will show errors but will not fail
        if: ${{ always() }}
        run: moodle-plugin-ci phpmd

      - name: Moodle Code Checker
        if: ${{ always() }}
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: Moodle PHPDoc Checker
        if: ${{ always() }}
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Validating
        if: ${{ always() }}
        run: moodle-plugin-ci validate

      - name: Check upgrade savepoints
        if: ${{ always() }}
        run: moodle-plugin-ci savepoints

      - name: Mustache Lint
        if: ${{ always() }}
        run: moodle-plugin-ci mustache

      - name: Grunt
        if: ${{ always() }}
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PHPUnit tests
        if: ${{ always() }}
        run: moodle-plugin-ci phpunit --fail-on-warning

  # Automatically releases tags when the CI tests passed.
  # Uploads go to the Moodle Marketplace API, which replaced the moodle.org Plugins Directory in July 2026:
  # https://moodledev.io/general/community/plugincontribution/moodlemarketplaceapi
  release:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      PLUGIN: mod_kialo
    permissions:
      contents: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.1

      # Creates plugin/development/mod_kialo.zip with the current version
      - name: Create bundle
        run: |
          cd plugin/development
          ./bundle.sh

      - name: Verify bundle
        run: |
          cd plugin/development
          if [[ ! -f mod_kialo.zip ]]; then
              echo "mod_kialo.zip not found!"
              exit 1
          fi
          unzip -qq -t mod_kialo.zip || {
              echo "failed to verify zip archive"
              exit 1
          }

          unzip -qq mod_kialo.zip -d unzipped_mod_kialo
          echo "zip archive verified"
          cd unzipped_mod_kialo

          if [[ ! -d kialo ]]; then
              echo "kialo folder not found!"
              exit 1
          fi
          cd kialo

          if [[ ! -d vendor ]]; then
              echo "vendor folder not found!"
              exit 1
          fi
          cd vendor

          if [[ ! -f readme_moodle.txt ]]; then
              echo "readme_moodle.txt not found!"
              exit 1
          fi
          echo "readme_moodle.txt found"

          vendor_directory_count=$(find . -mindepth 1 -maxdepth 1 -type d | wc -l)
          min_vendor_directory_count=15
          if [[ $vendor_directory_count -lt $min_vendor_directory_count ]]; then
              echo "Too few vendor directories found!"
              exit 1
          fi
          echo "vendor directory count verified"

      # Beta tags are cut from feature branches that are not yet merged to main, so GitHub's
      # generate_release_notes (which only lists merged PRs) cannot describe them. Use the current
      # version's section from CHANGES.md as the release body instead. The Marketplace upload uses it too.
      - name: Build release notes from CHANGES.md
        run: |
          cd plugin
          awk '/^### /{n++} n==2{exit} n>=1{print}' CHANGES.md > release_notes.md
          cat release_notes.md

      # Create a new release on GitHub
      - name: Release to GitHub
        id: github-release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            plugin/development/mod_kialo.zip
          # Betas: use the hand-written CHANGES.md section (accurate before the PR is merged).
          # Finals (tagged from main): use GitHub's auto-generated notes from the merged PRs.
          body_path: ${{ contains(github.ref, '-beta') && 'plugin/release_notes.md' || '' }}
          generate_release_notes: ${{ !contains(github.ref, '-beta') }}
          prerelease: ${{contains(github.ref, '-beta')}}

      # Uploads the release to the Moodle Marketplace. A 201 means the version was queued for prechecks, not yet published.
      - name: Upload to Moodle Marketplace
        if: github.event_name == 'push' && !contains(github.ref, '-beta')
        env:
          TOKEN: ${{ secrets.MOODLE_MARKETPLACE_TOKEN }}  # see https://marketplace.moodle.com/account/security
        run: |
          TAGNAME="${GITHUB_REF##*/}"
          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -s -o "${RESPONSE_FILE}" -w "%{http_code}" -X POST \
            -H "Authorization: Bearer ${TOKEN}" \
            -F "file=@plugin/development/mod_kialo.zip" \
            -F "releaseNotes=<plugin/release_notes.md" \
            -F "vcsTag=${TAGNAME}" \
            -F "vcsRepositoryUrl=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            "https://marketplace.moodle.com/api/plugins/${PLUGIN}/versions")
          jq . "${RESPONSE_FILE}" || cat "${RESPONSE_FILE}"
          if [[ "${HTTP_CODE}" != "201" ]]; then
            echo "Marketplace upload failed with HTTP ${HTTP_CODE}"
            exit 1
          fi
